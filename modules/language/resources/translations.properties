Sets\ the\ desired\ height\ for\ the\ bars\ in\ the\ barcode\ (in\ pixels).\n\ Note\ that\ some\ barcode\ implementations\ will\ not\ allow\ the\ height\ to\ go\ below\ a\ minimum\ size.\n\ This\ is\ not\ the\ height\ of\ the\ component\ as\ a\ whole,\ as\ it\ does\ not\ specify\ the\ height\ of\n\ any\ text\ that\ may\ be\ drawn\ and\ does\ not\ include\ borders.\n\ \ JasperReports\ will\ scale\ final\ bar\ to\ the\ element\ size.=Define a altura desejada para as barras no c\u00f3digo de barras (em pixels).\n Observe que algumas implementa\u00e7\u00f5es de c\u00f3digo de barras n\u00e3o permitir\u00e3o que a altura fique abaixo de um tamanho m\u00ednimo.\n Esta n\u00e3o \u00e9 a altura do componente como um todo, pois n\u00e3o especifica a altura de \n qualquer texto que possa ser desenhado e n\u00e3o inclui bordas.\n JasperReports dimensionar\u00e1 a barra final para o tamanho do elemento.
Bar\ Width=Largura da Barra
Sets\ the\ desired\ bar\ width\ for\ the\ barcode.\ This\ is\ the\ width\n\ (in\ pixels)\ of\ the\ thinnest\ bar\ in\ the\ barcode.\ Other\ bars\ will\ change\ their\ size\ relative\ to\ this.\n\ JasperReports\ will\ scale\ final\ bar\ to\ the\ element\ size.=Define a largura de barra desejada para o c\u00f3digo de barras. Esta \u00e9 a largura\n (em pixels) da barra mais fina do c\u00f3digo de barras. Outras barras mudar\u00e3o seu tamanho em rela\u00e7\u00e3o a isso. \n JasperReports dimensionar\u00e1 a barra final para o tamanho do elemento.
