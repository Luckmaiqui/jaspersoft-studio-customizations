name: Release
on:
  push:
    tags: ['v*']
    branches: ['main']
    paths: ['jasperstudio-update-v2.3.2.zip']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do pacote em versions.json (ex.: 1.0.0)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Enable long paths on the runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Import verified 2.3.2 update
        if: github.ref_type == 'branch' && (github.event_name == 'push' || inputs.version == '2.3.2')
        shell: pwsh
        run: |
          $archive = 'jasperstudio-update-v2.3.2.zip'
          if ((Get-FileHash $archive).Hash -ne 'B6DC5E3409681994CE816F42E551EBB9AE5B095D581A6CE1938B5247C77465C0') { throw 'SHA256 inválido' }
          $stage = Join-Path $env:RUNNER_TEMP 'source-update'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          git rm --ignore-unmatch artifacts/plugins/com.salutem.jasper.connectionorder_1.3.1.jar
          Get-ChildItem -LiteralPath $stage | Where-Object Name -notin @('.git','.github') | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination . -Recurse -Force }
          node scripts/Verify.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Verificação falhou' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'fix: conectar servidor antes da pesquisa nativa'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Push falhou' }
          }
      - name: Validate release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $v = (Get-Content versions.json -Raw | ConvertFrom-Json).packageVersion
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw 'Tag divergente de versions.json' }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_VERSION -ne $v) { throw 'Versão divergente de versions.json' }
          if (-not (Test-Path "docs/releases/v$v.md")) { throw 'Notas de release ausentes' }
          "RELEASE_TAG=v$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify artifacts and translations
        run: node scripts/Verify.mjs
      - name: Test numeric order
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test-classes | Out-Null
          javac -encoding UTF-8 -d build/test-classes modules/connection-order/src/com/salutem/order/NumericOrder.java tests/NumericOrderTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp build/test-classes NumericOrderTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer
        shell: pwsh
        run: ./scripts/Build.ps1 -PackageOnly
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist/*.zip | ForEach-Object FullName) + @((Resolve-Path dist/SHA256SUMS.txt).Path)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target (git rev-parse HEAD) --title "Pacote de Atualizações do JasperStudio" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            gh release edit $release.tagName --repo $env:GITHUB_REPOSITORY --title 'Pacote de Atualizações do JasperStudio'
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao atualizar título da release' }
          }
