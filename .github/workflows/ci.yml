name: Validate
on:
  push:
    paths-ignore: ['*.zip']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Enable long paths on the runner
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify sources, artifacts and translations
        run: node scripts/Verify.mjs
      - name: Test numeric order
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/test-classes | Out-Null
          javac -encoding UTF-8 -d build/test-classes modules/connection-order/src/com/salutem/order/NumericOrder.java tests/NumericOrderTest.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp build/test-classes NumericOrderTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer from verified artifacts
        shell: pwsh
        run: ./scripts/Build.ps1 -PackageOnly
