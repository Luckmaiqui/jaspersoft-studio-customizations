Specifying\ weights\ can\ have\ a\ significant\ impact\ on\ the\ appearance\ of\ the\ components.\ Row\ Weight\ are\ used\ to\ determine\ how\ to\ distribute\ space\ among\ rows;\ The\ default\ value\ is\ 1.0\ and\ it\ is\ used\ in\ proportion\ with\ the\ weight\ of\ the\ other\ elements\ to\ know\ how\ much\ space\ the\ element\ take.=A especifica\u00e7\u00e3o de pesos pode ter um impacto significativo na apar\u00eancia dos componentes. Row Weight \u00e9 usado para determinar como distribuir o espa\u00e7o entre as linhas; O valor padr\u00e3o \u00e9 1,0 e \u00e9 usado proporcionalmente ao peso dos demais elementos para saber quanto espa\u00e7o o elemento ocupa.
