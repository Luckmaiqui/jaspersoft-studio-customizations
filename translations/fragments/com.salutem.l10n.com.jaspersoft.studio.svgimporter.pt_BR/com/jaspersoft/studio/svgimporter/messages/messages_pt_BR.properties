InkscapeMessageDialog_dialogMessage=Para importar um arquivo PDF \u00e9 necess\u00e1rio convert\u00ea-lo para o formato SVG. Essa convers\u00e3o \u00e9 feita com o software gratuito e de c\u00f3digo aberto Inkscape, dispon\u00edvel para todas as plataformas. Parece que voc\u00ea n\u00e3o tem o Inkscape instalado, voc\u00ea pode baixar e instalar a partir de sua p\u00e1gina oficial <a href="https://inkscape.org"></a>.\nSe voc\u00ea j\u00e1 tiver o Inkscape instalado, insira o caminho da sua pasta Inkscape na \u00e1rea de texto a seguir. Esse valor sempre pode ser alterado na se\u00e7\u00e3o Propriedades das Prefer\u00eancias do Jaspersoft Studio.
