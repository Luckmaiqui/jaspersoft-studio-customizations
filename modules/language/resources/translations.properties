Specifying\ weights\ can\ have\ a\ significant\ impact\ on\ the\ appearance\ of\ the\ components.\ Column\ Weight\ are\ used\ to\ determine\ how\ to\ distribute\ space\ among\ columns;\ The\ default\ value\ is\ 1.0\ and\ it\ is\ used\ in\ proportion\ with\ the\ weight\ of\ the\ other\ elements\ to\ know\ how\ much\ space\ the\ element\ take.=A especifica\u00e7\u00e3o de pesos pode ter um impacto significativo na apar\u00eancia dos componentes. Os Pesos da Coluna s\u00e3o usados \u200b\u200bpara determinar como distribuir o espa\u00e7o entre as colunas; O valor padr\u00e3o \u00e9 1,0 e \u00e9 usado proporcionalmente ao peso dos demais elementos para saber quanto espa\u00e7o o elemento ocupa.
Define\ if\ the\ size\ of\ the\ element\ is\ fixed\ or\ grop\ to\ fill\ the\ current\ cell.\ How\ much\ the\ element\ grow\ if\ it\ is\ not\ fixed\ is\ defined\ using\ the\ weight.\ If\ it\ is\ fixed\ the\ cell\ can\ grow\ due\ to\ other\ cells\ on\ the\ same\ colum\ or\ row,\ but\ the\ element\ will\ never\ fill\ it=Defina se o tamanho do elemento \u00e9 fixo ou grop para preencher a c\u00e9lula atual. O quanto o elemento cresce se n\u00e3o for fixo \u00e9 definido atrav\u00e9s do peso. Se for fixo a c\u00e9lula pode crescer devido a outras c\u00e9lulas na mesma coluna ou linha, mas o elemento nunca ir\u00e1 preench\u00ea-la
