name: Import connection search 2.1
on:
  push:
    paths: ['jaspersoft-studio-update-v2.1.0.zip']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-search-v21
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Import verified source archive once
        shell: bash
        run: |
          if grep -q '"packageVersion": "2.1.0"' versions.json; then
            echo "Version 2.1 already imported; nothing to overwrite."
            exit 0
          fi
          echo '1aefd81dce811a49b9a15b300301a24eeea2f718a0366cbd19402c987b386b1c  jaspersoft-studio-update-v2.1.0.zip' | sha256sum -c -
          unzip -qq jaspersoft-studio-update-v2.1.0.zip -d "$RUNNER_TEMP/jaspersoft-source"
          git rm --ignore-unmatch 'artifacts/plugins/com.salutem.jasper.connectionorder_1.0.0.jar'
          SOURCE_DIR="$RUNNER_TEMP/jaspersoft-source" python3 - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['SOURCE_DIR'])
          for item in source.iterdir():
              if item.name in ('.git', '.github'):
                  continue
              if item.is_dir():
                  shutil.copytree(item, pathlib.Path.cwd() / item.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, pathlib.Path.cwd() / item.name)
          PY
          node scripts/Verify.mjs
          mkdir -p build/test-classes
          javac -encoding UTF-8 -d build/test-classes modules/connection-order/src/com/salutem/order/NumericOrder.java tests/NumericOrderTest.java
          java -cp build/test-classes NumericOrderTest
          pwsh -NoProfile -File scripts/Build.ps1 -PackageOnly
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github'
          git commit -m 'feat: importar fontes e componentes validados da versão 2.1.0'
          git push origin HEAD:main
