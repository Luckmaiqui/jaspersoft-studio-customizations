To\ generate\ a\ template\ for\ a\ particular\ type\ of\ element\ place\ in\ the\ detail\ band\ an\ element\ of\ the\ same\ type\ and\ customize\ the\ attributes\ you\ want\ as\ standard.\ For\ example\ if\ you\ place\ in\ the\ detail\ of\ the\ Template\ Set\ a\ Static\ Text\ element\ with\ the\ background\ color\ set\ to\ Green,\ when\ you\ will\ use\ this\ template\ every\ new\ static\ text\ will\ have\ also\ a\ Green\ background.\n\nPlease\ note\ that\ some\ properties\ are\ not\ taken\ from\ the\ template,\ like\ every\ property\ based\ on\ an\ expression\ or\ the\ styles\ name.\ Note\ that\ only\ the\ elements\ placed\ in\ the\ detail\ band\ of\ the\ Template\ Set\ are\ used\ as\ Template\ for\ the\ elements\ of\ the\ same\ type,\ so\ this\ informative\ text\ is\ not\ used\ as\ Template\ for\ this\ reason.\n\nTo\ switch\ from\ a\ template\ set\ use\ the\ Settings\ menu\ on\ the\ right\ upper\ bound\ of\ the\ report\ editor\ and\ then\ select\ Elements\ Templates.=Para gerar um template para um determinado tipo de elemento coloque na faixa de detalhe um elemento do mesmo tipo e personalize os atributos que deseja como padr\u00e3o. Por exemplo, se voc\u00ea colocar no detalhe do Conjunto de Modelos um elemento Texto Est\u00e1tico com a cor de fundo definida como Verde, quando voc\u00ea usar este modelo, todo novo texto est\u00e1tico tamb\u00e9m ter\u00e1 um fundo Verde.\n\nObserve que algumas propriedades n\u00e3o s\u00e3o retiradas do modelo, como toda propriedade baseada em uma express\u00e3o ou no nome do estilo. Observe que apenas os elementos colocados na faixa de detalhe do Conjunto de Modelos s\u00e3o utilizados como Modelo para os elementos do mesmo tipo, portanto este texto informativo n\u00e3o \u00e9 utilizado como Modelo por este motivo.\n\nPara mudar de um conjunto de modelos utilize o menu Configura\u00e7\u00f5es no limite superior direito do editor de relat\u00f3rios e selecione Modelos de Elementos.
