Defines\ the\ mode\ of\ dragging.\ If\ set\ to\ true,\ edges\ of\ the\ polygon\ are\ interpreted\ as\ geodesic\ and\ will\ follow\ the\ curvature\ of\ the\ Earth\ when\ the\ path\ contour\ is\ dragged.\ Defaults\ to\ false.=Define o modo de arrastar. Se definido como verdadeiro, as arestas do pol\u00edgono ser\u00e3o interpretadas como geod\u00e9sicas e seguir\u00e3o a curvatura da Terra quando o contorno do caminho for arrastado. O padr\u00e3o \u00e9 falso.
If\ set\ to\ true,\ the\ path\ is\ visible\ on\ the\ map.\ Defaults\ to\ true.=Se definido como verdadeiro, o caminho ficar\u00e1 vis\u00edvel no mapa. O padr\u00e3o \u00e9 verdadeiro.
