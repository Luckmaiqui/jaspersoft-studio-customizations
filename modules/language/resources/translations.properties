Represents\ the\ identifier\ of\ a\ given\ path,\ necessary\ when\ multiple\ paths\ have\ to\ be\ represented\ on\ the\ same\ map.\ Points\ with\ the\ same\ name\ property\ belong\ to\ the\ same\ path.\ If\ not\ provided,\ the\ point\ will\ be\ added\ to\ the\ default\ path.=Representa o identificador de um determinado caminho, necess\u00e1rio quando v\u00e1rios caminhos precisam ser representados no mesmo mapa. Pontos com a mesma propriedade de nome pertencem ao mesmo caminho. Se n\u00e3o for fornecido, o ponto ser\u00e1 adicionado ao caminho padr\u00e3o.
