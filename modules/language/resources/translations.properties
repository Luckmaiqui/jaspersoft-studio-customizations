represents\ the\ address\ of\ the\ map\ center\ and\ is\ optional.\ It\ will\ be\ considered\ only\ when\ the\ latitude\ and/or\ longitude\ expressions\ are\ missing\ or\ empty.\ Computing\ address\ expressions\ relies\ on\ expensive\ time\ and\ resources\ consumption,\ therefore\ the\ report\ filling\ performance\ may\ visibly\ decline.\ It\ is\ highly\ recommended\ to\ use\ latitude\ and\ longitude\ expressions\ whenever\ possible.\ =representa o endere\u00e7o do centro do mapa e \u00e9 opcional. Ser\u00e1 considerado somente quando as express\u00f5es de latitude e/ou longitude estiverem faltando ou vazias. O c\u00e1lculo de express\u00f5es de endere\u00e7o depende do consumo dispendioso de tempo e recursos, portanto, o desempenho do preenchimento de relat\u00f3rios pode diminuir visivelmente. \u00c9 altamente recomend\u00e1vel usar express\u00f5es de latitude e longitude sempre que poss\u00edvel. 
