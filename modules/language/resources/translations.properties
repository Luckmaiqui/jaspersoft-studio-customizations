string\ value\ representing\ the\ label\ for\ the\ default\ pin\ icons.\ This\ property\ is\ taken\ into\ account\ when\ none\ of\ icon\ or\ icon.url\ properties\ are\ set.\ \nNote\:\ Unlike\ interactive\ maps,\ Google\ static\ maps\ require\ single\ uppercase\ alphanumeric\ character\ labels.\ If\ multiple\ character\ labels\ are\ set,\ the\ JR\ engine\ will\ process\ the\ entire\ label\ for\ dynamic\ maps\ and\ only\ the\ first\ character\ in\ the\ label\ for\ static\ maps.\ Labels\ are\ displayed\ only\ for\ default\ and\ mid\ sized\ markers,\ small\ and\ tiny\ markers\ provide\ no\ capability\ to\ display\ labels.=valor de string que representa o r\u00f3tulo dos \u00edcones de pinos padr\u00e3o. Esta propriedade \u00e9 levada em considera\u00e7\u00e3o quando nenhuma das propriedades icon ou icon.url est\u00e1 definida. \nNota: Ao contr\u00e1rio dos mapas interativos, os mapas est\u00e1ticos do Google exigem r\u00f3tulos de caracteres alfanum\u00e9ricos mai\u00fasculos \u00fanicos. Se v\u00e1rios r\u00f3tulos de caracteres forem definidos, o mecanismo JR processar\u00e1 o r\u00f3tulo inteiro para mapas din\u00e2micos e apenas o primeiro caractere do r\u00f3tulo para mapas est\u00e1ticos. Os r\u00f3tulos s\u00e3o exibidos apenas para marcadores padr\u00e3o e de tamanho m\u00e9dio; marcadores pequenos e min\u00fasculos n\u00e3o oferecem capacidade de exibir r\u00f3tulos.
