PathDescriptor_15=Preencher opacidade
PathDescriptor_16=valor num\u00e9rico entre 0 (padr\u00e3o) e 1. Considerado apenas para pol\u00edgonos, representa a opacidade de preenchimento do contorno poligonal. 1 significa 100% opaco, 0 significa 100% transparente.
PathDescriptor_17=\u00c9 pol\u00edgono
PathDescriptor_18=\ Se definido como verdadeiro, o \u00faltimo ponto do caminho ser\u00e1 conectado ao primeiro ponto para formar um pol\u00edgono (caminho fechado). O valor padr\u00e3o \u00e9 falso
PathDescriptor_19=Clic\u00e1vel
PathDescriptor_2=Representa o identificador de um determinado caminho, necess\u00e1rio quando v\u00e1rios caminhos precisam ser representados no mesmo mapa. Pontos com a mesma propriedade de nome pertencem ao mesmo caminho. Se n\u00e3o for fornecido, o ponto ser\u00e1 adicionado ao caminho padr\u00e3o.
PathDescriptor_20=Se definido como verdadeiro, o objeto path poder\u00e1 manipular eventos de mouse. O padr\u00e3o \u00e9 verdadeiro.
PathDescriptor_21=Edit\u00e1vel
PathDescriptor_22=Se definido como verdadeiro, o usu\u00e1rio poder\u00e1 editar o caminho usando os pontos de controle mostrados ao longo da linha do caminho. O padr\u00e3o \u00e9 falso.
PathDescriptor_23=Arrast\u00e1vel
PathDescriptor_24=Se definido como verdadeiro, o usu\u00e1rio poder\u00e1 arrastar o contorno do caminho sobre o mapa. O padr\u00e3o \u00e9 falso.
PathDescriptor_25=Geod\u00e9sico
PathDescriptor_26=Define o modo de arrastar. Se definido como verdadeiro, as arestas do pol\u00edgono ser\u00e3o interpretadas como geod\u00e9sicas e seguir\u00e3o a curvatura da Terra quando o contorno do caminho for arrastado. O padr\u00e3o \u00e9 falso.
PathDescriptor_27=Vis\u00edvel
PathDescriptor_28=Se definido como verdadeiro, o caminho ficar\u00e1 vis\u00edvel no mapa. O padr\u00e3o \u00e9 verdadeiro.
PathDescriptor_29=\u00cdndice Z
PathDescriptor_3=Endere\u00e7o
